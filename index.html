<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Film Finder</title>
    <meta name="description" content="Trova film e registi con Film Finder" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎬%3C/text%3E%3C/svg%3E" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #111116;
        color: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }
      .wrapper { max-width: 480px; width: 100%; }
      h1 { font-size: 32px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.5px; }
      p { font-size: 16px; color: #a1a1aa; margin-bottom: 32px; line-height: 1.5; }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: #ffffff;
        color: #111116;
        border: none;
        border-radius: 12px;
        padding: 14px 24px;
        font-size: 16px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        transition: transform 0.1s, box-shadow 0.2s;
      }
      .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(255,255,255,0.15); }
      .btn:active { transform: translateY(0); }
      .hint { margin-top: 24px; font-size: 13px; color: #71717a; }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <h1>🎬 Film Finder</h1>
      <p>Scopri film, registi e molto altro. Esplora il catalogo direttamente dal tuo browser.</p>
      <a href="/Film-Finder2/" class="btn">Apri l'app &rarr;</a>
      <p class="hint">Film Finder &middot; Pagina ospitata su GitHub Pages</p>
    </div>
  </body>
</html>
